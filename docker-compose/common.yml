# WARNING: Do not deploy this tutorial configuration directly to a production environment
#
# The tutorial docker-compose files have not been written for production deployment and will not 
# scale. A proper architecture has been sacrificed to keep the narrative focused on the learning 
# goals, they are just used to deploy everything onto a single Docker machine. All FIWARE components 
# are running at full debug and extra ports have been exposed to allow for direct calls to services. 
# They also contain various obvious security flaws - passwords in plain text, no load balancing,
# no use of HTTPS and so on. 
# 
# This is all to avoid the need of multiple machines, generating certificates, encrypting secrets
# and so on, purely so that a single docker-compose file can be read as an example to build on, 
# not use directly. 
# 
# When deploying to a production environment, please refer to the Helm Repository
# for FIWARE Components in order to scale up to a proper architecture:
# 
# see: https://github.com/FIWARE/helm-charts/
#
services:
  # @context file is served from here
  ld-context:
    labels:
      org.fiware: 'tutorial'
    image: httpd:alpine
    hostname: context
    container_name: fiware-ld-context
    ports:
        - "3004:80"
    volumes:
        - data-models:/usr/local/apache2/htdocs/
        - type: bind
          source: ${PWD}/conf/mime.types
          target: /usr/local/apache2/conf/mime.types
          read_only: true
    healthcheck:
      test: (wget --server-response --spider --quiet  http://context/user-context.jsonld 2>&1 | awk 'NR==1{print $$2}'|  grep -q -e "200") || exit 1

  # Cache foe Sensor Data Readings
  redis-sensors:
    labels:
      org.fiware: 'tutorial'
    image: redis:8.2.0-alpine
    container_name: redis
    hostname: redis-for-sensors
    ports:
      - "6378:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      interval: 10s

  # Databases
  mongo-db:
    labels:
      org.fiware: 'tutorial'
    image: mongo:${MONGO_DB_VERSION}
    hostname: mongo-db
    container_name: db-mongo
    expose:
      - "${MONGO_DB_PORT}"
    ports:
      - "${MONGO_DB_PORT}:${MONGO_DB_PORT}" # localhost:27017
    networks:
      - default
    volumes:
      - mongo-db:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD","mongosh", "localhost:27017/test", "--quiet"]
      interval: 5s

  # IoT-Agent is configured for the UltraLight Protocol
  iot-agent:
    labels:
      org.fiware: 'tutorial'
    image: quay.io/fiware/iotagent-json:${JSON_VERSION}
    hostname: iot-agent
    container_name: fiware-iot-agent
    depends_on:
      - mongo-db
      - ld-context
    networks:
      - default
    ports:
      - "${IOTA_NORTH_PORT}:${IOTA_NORTH_PORT}" # localhost:4041
      - "${IOTA_SOUTH_PORT}:${IOTA_SOUTH_PORT}" # localhost:7896
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'
    environment:
      - IOTA_NORTH_PORT=${IOTA_NORTH_PORT}
      - IOTA_REGISTRY_TYPE=mongodb #Whether to hold IoT device info in memory or in a database
      - IOTA_LOG_LEVEL=INFO # The log level of the IoT Agent
      - IOTA_TIMESTAMP=true # Supply timestamp information with each measurement
      - IOTA_AUTOCAST=true # Ensure Ultralight number values are read as numbers not strings
      - IOTA_MONGO_URI=mongodb://mongo-db:${MONGO_DB_PORT}/iotagentjson
      - IOTA_HTTP_PORT=${IOTA_SOUTH_PORT}
      - IOTA_DEFAULT_RESOURCE=/iot/json # The port used for device traffic over HTTP
      - IOTA_PROVIDER_URL=http://iot-agent:${IOTA_NORTH_PORT}
      - IOTA_CB_NGSI_VERSION=ld # use NGSI-LD when sending updates for active attributes
      - IOTA_JSON_LD_CONTEXT=http://context/user-context.jsonld
      - IOTA_FALLBACK_TENANT=openiot
      - IOTA_MULTI_CORE=true
      - IOTA_AMQP_DISABLED=true
      - IOTA_MQTT_DISABLED=true
    healthcheck:
      interval: 30s

  farmer:
    labels:
      org.fiware: 'tutorial'
    image: quay.io/fiware/tutorials.forwarder
    hostname: 'farmer'
    container_name: cb-farmer
    ports:
      - 1027:80
    environment:
      - TENANT=farmer
      - DEBUG=broker:*

  devices:
    labels:
      org.fiware: 'tutorial'
    image: quay.io/fiware/tutorials.forwarder
    hostname: 'openiot'
    container_name: cb-devices
    ports:
      - 1028:80
    environment:
      - TENANT=openiot
      - DEBUG=broker:*

  # A series of dummy IoT Sensors over HTTP
  iot-sensors:
    labels:
      org.fiware: 'tutorial'
    image: quay.io/fiware/tutorials.iot-devices
    hostname: iot-sensors
    container_name: fiware-iot-devices
    depends_on:
      - redis-sensors
    networks:
      - default
    expose:
      - "${TUTORIAL_DUMMY_DEVICE_PORT}"
    ports:
      - "${TUTORIAL_DUMMY_DEVICE_PORT}:${TUTORIAL_DUMMY_DEVICE_PORT}" # localhost:3001
    environment:
      - DEBUG=devices:*
      - WEB_APP_HOST=tutorial
      - WEB_APP_PORT=${TUTORIAL_APP_PORT} # Port used by the content provider proxy and web-app for viewing data
      - IOTA_HTTP_HOST=iot-agent
      - IOTA_HTTP_PORT=${IOTA_SOUTH_PORT}
      - IOTA_DEFAULT_RESOURCE=/iot/json
      - PIG_COUNT=${PIG_COUNT}
      - COW_COUNT=${COW_COUNT}
      - REDIS_HOST=redis-for-sensors
      - DUMMY_DEVICES_PAYLOAD=JSON
  
  # Tutorial acts as a Farm Management Information System  
  tutorial:
    labels:
      org.fiware: 'tutorial'
    image: quay.io/fiware/tutorials.ngsi-ld
    hostname: tutorial
    container_name: fiware-tutorial
    depends_on:
      - mongo-db
    networks:
      - default
    expose:
      - "${TUTORIAL_APP_PORT}"
    ports:
      - "${TUTORIAL_APP_PORT}:${TUTORIAL_APP_PORT}" # localhost:3000
    environment:
      - DEBUG=tutorial:*
      - WEB_APP_PORT=${TUTORIAL_APP_PORT} # Port used by the content provider proxy and web-app for viewing data
      - IOTA_HTTP_HOST=iot-agent
      - IOTA_HTTP_PORT=${IOTA_SOUTH_PORT}
      - IOTA_DEFAULT_RESOURCE=/iot/json
      - DUMMY_DEVICES=http://iot-sensors:3001
      - MONGO_URL=mongodb://mongo-db:27017
      - IOTA_JSON_LD_CONTEXT=http://context/user-context.jsonld
      - DUMMY_DEVICES_PAYLOAD=JSON

  # MCP Server exposes the Context Broker to LLM agents as tools and resources
  mcp-server:
    labels:
      org.fiware: 'tutorial'
    image: quay.io/fiware/tutorials.mcp-server
    hostname: mcp-server
    container_name: fiware-mcp-server
    depends_on:
      ld-context:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - default
    expose:
      - "${MCP_SERVER_PORT}"
    ports:
      - "${MCP_SERVER_PORT}:${MCP_SERVER_PORT}" # localhost:3003
    environment:
      - DEBUG=mcp:*
      - MCP_TRANSPORT=http
      - MCP_PORT=${MCP_SERVER_PORT}
      - SCHEMA_DIR=/schemas
      - NGSI_LD_CONTEXT=http://context/user-context.jsonld
      - WRITABLE=true
      - WRITE_TENANT=farmer
      - WRITE_LOCAL_ONLY=true
      # Broker-derived entity types are discovered at start-up and merged with the
      # curated schemas mounted at /schemas.
      - DISCOVERY=merge
      # The server verifies the bearer token a second time, after APISIX, and forwards
      # it to the broker so Keycloak's UMA policies apply to the caller, not to the server.
      - AUTH_ENABLED=${AUTH_ENABLED}
      # The issuer is the string in the token's `iss` claim, which Keycloak pins to
      # its frontend hostname; JWKS and the token endpoint are reached in-network.
      - OIDC_ISSUER=http://localhost:${KEYCLOAK_PORT}/realms/${OIDC_REALM}
      - OIDC_JWKS_URI=http://keycloak:8080/realms/${OIDC_REALM}/protocol/openid-connect/certs
      - OIDC_TOKEN_URL=http://keycloak:8080/realms/${OIDC_REALM}/protocol/openid-connect/token
      - MCP_RESOURCE_URL=http://localhost:${MCP_PROXY_PORT}/mcp
      - OIDC_CLIENT_ID=${MCP_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${MCP_CLIENT_SECRET}
    volumes:
      - type: bind
        source: ${PWD}/schemas
        target: /schemas
        read_only: true
      - type: bind
        source: ${PWD}/prompts
        target: /prompts
        read_only: true

  # Chat-bot - a web UI and LLM agent loop that drives the broker via the MCP Server
  chat-bot:
    labels:
      org.fiware: 'tutorial'
    build:
      context: ${PWD}/chat-bot
    image: quay.io/fiware/tutorials.chat-bot
    hostname: chat-bot
    container_name: fiware-chat-bot
    depends_on:
      - mcp-server
    networks:
      - default
    expose:
      - "${CHAT_BOT_PORT}"
    ports:
      - "${CHAT_BOT_PORT}:${CHAT_BOT_PORT}" # localhost:3006
    environment:
      # The chat-bot reads bare names (PORT / MCP_URL / PROVIDER / <PROVIDER>_*);
      # map the CHAT_BOT_* .env vars onto them and point MCP_URL in-network.
      - PORT=${CHAT_BOT_PORT}
      # Straight at the MCP server while the tutorial is unsecured; through the
      # gateway once the security section swaps this in .env, at which point the
      # bot must present the signed-in user's token like any other client.
      - MCP_URL=${MCP_ENDPOINT}
      - AUTH_ENABLED=${AUTH_ENABLED}
      - OIDC_ISSUER=http://keycloak:8080/realms/${OIDC_REALM}
      # The browser is redirected here, so this must be reachable from the host.
      - OIDC_PUBLIC_ISSUER=http://localhost:${KEYCLOAK_PORT}/realms/${OIDC_REALM}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=http://localhost:${CHAT_BOT_PORT}/login/callback
      - SESSION_SECRET=${SESSION_SECRET}
      - PROVIDER=${CHAT_BOT_PROVIDER}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL}
      - GEMINI_MODEL=${GEMINI_MODEL}

  # APISIX acts as an API Gateway — it validates JWTs on the way to the MCP Server
  # and enforces Keycloak role-based access on the way to the Context Broker
  apisix:
    image: apache/apisix:3.9.0-debian
    container_name: fiware-apisix
    hostname: apisix
    labels:
      org.fiware: 'tutorial'
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - default
    ports:
      - "${MCP_PROXY_PORT}:${APISIX_PORT}" # localhost:1030
    volumes:
      - ../apisix-config/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ../apisix-config/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    healthcheck:
      # The APISIX image ships neither curl nor wget, and its /bin/sh is dash, which
      # has no /dev/tcp - so the probe has to ask for bash by name.
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/${APISIX_PORT} && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200" ]
      interval: 5s
      retries: 12
      start_period: 10s

  # Keycloak is the Identity and Access Management server
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    container_name: fiware-keycloak
    hostname: keycloak
    labels:
      org.fiware: 'tutorial'
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - default
    ports:
      - "${KEYCLOAK_PORT}:8080" # localhost:3005
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres-keycloak/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=password
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=1234
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=1234
      - KC_HTTP_PORT=8080
      # Pin the frontend hostname so the `iss` claim is the same string whether the
      # token was requested from the host or from inside the network. Without this
      # Keycloak stamps `iss` from the request host, and a token fetched on
      # localhost:3005 is rejected by a verifier expecting keycloak:8080.
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=${KEYCLOAK_PORT}
      - KC_HOSTNAME_STRICT=false
      # Backchannel URLs still resolve to the request host, so APISIX and the MCP
      # server keep fetching JWKS over the Docker network.
      - KC_HOSTNAME_STRICT_BACKCHANNEL=false
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
    command: start-dev --import-realm
    volumes:
      - ../realm-config:/opt/keycloak/data/import:ro
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s

  # PostgreSQL database for Keycloak
  postgres-keycloak:
    image: postgres:${POSTGRES_VERSION}
    container_name: db-postgres-keycloak
    hostname: postgres-keycloak
    labels:
      org.fiware: 'tutorial'
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=password
    networks:
      - default
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "keycloak" ]
      interval: 10s
      retries: 6

networks:
  default:
    labels:
      org.fiware: 'tutorial'
    ipam:
      config:
        - subnet: 172.18.1.0/24

volumes:
  crate-db: ~
  redis-db: ~
  grafana: ~
  mongo-db: ~
  mongo-config: ~
  redis-data: ~
  data-models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data-models
